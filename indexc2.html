<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Table AR Menu</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14110F;
    --ink-soft:#1D1916;
    --ink-soft2:#241F1A;
    --paper:#F4EFE6;
    --ember:#FF7A45;
    --gold:#D4AF37;
    --line:rgba(244,239,230,0.12);
    --text-dim:#B7AFA2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}

  #app{
    height:100vh;height:100dvh;
    display:grid;
    grid-template-rows: 56px auto 1fr 84px;
    grid-template-areas: "topbar" "strip" "stage" "bottombar";
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---- top bar ---- */
  #topbar{
    grid-area:topbar;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#181410,#14110F);
  }
  .table-tag{font-size:12px;color:var(--text-dim);}
  .table-tag b{color:var(--paper);}
  .brand{font-size:15px;font-weight:700;}
  .brand span{color:var(--ember);}

  /* ---- dish strip (horizontal scroll of vertical cards) ---- */
  #strip{
    grid-area:strip;
    display:flex;
    gap:10px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  #strip::-webkit-scrollbar{display:none;}
  .dish-card{
    flex:0 0 auto;
    width:84px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    opacity:.75;
    transition:opacity .15s, transform .15s;
  }
  .dish-card.active{opacity:1;}
  .dish-card:active{transform:scale(.95);}
  .dish-card .thumb{
    width:84px;height:104px;
    border-radius:12px;
    object-fit:cover;
    border:1.5px solid transparent;
    display:block;
  }
  .dish-card.active .thumb{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,122,69,.15);}
  .dish-card .cname{font-size:10.5px;text-align:center;line-height:1.2;color:var(--text-dim);}
  .dish-card.active .cname{color:var(--paper);}
  .dish-card .badge{
    position:relative;top:-96px;left:30px;
    width:18px;height:18px;border-radius:50%;
    background:var(--gold);color:#1A0E06;
    font-size:10px;font-weight:700;
    display:none;align-items:center;justify-content:center;
    margin-bottom:-18px;
  }
  .dish-card.in-cart .badge{display:flex;}

  /* ---- stage ---- */
  #stage{
    grid-area:stage;
    position:relative;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:10px 16px;
    min-height:0;
  }
  .dish-meta{text-align:center;margin-bottom:8px;}
  .dish-meta h2{font-size:20px;margin:0 0 4px;}
  .dish-meta p{margin:0;color:var(--text-dim);font-size:13px;max-width:420px;}

  model-viewer#viewer{
    width:100%;max-width:480px;
    height:min(40vh,380px);
    background:
      radial-gradient(ellipse at 50% 82%, rgba(255,122,69,.12), transparent 60%),
      var(--ink-soft);
    border-radius:20px;border:1px solid var(--line);
  }
  .price-pill{
    margin-top:10px;font-family:'Space Grotesk',sans-serif;
    font-weight:700;color:var(--gold);font-size:15px;
  }
  #ar-launch{
    margin-top:6px;background:none;border:1px solid var(--line);
    color:var(--paper);font-size:12.5px;padding:8px 16px;
    border-radius:22px;cursor:pointer;
  }
  #ar-launch:active{border-color:var(--ember);}

  /* ---- bottom bar ---- */
  #bottombar{
    grid-area:bottombar;
    border-top:1px solid var(--line);
    background:linear-gradient(0deg,#181410,#14110F);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    gap:12px;
  }

  /* left: add / stepper */
  .add-zone{flex:0 0 auto;}
  .add-btn{
    padding:13px 20px;
    border-radius:14px;border:none;
    background:var(--ember);color:#1A0E06;
    font-weight:700;font-family:'Space Grotesk',sans-serif;
    font-size:13.5px;cursor:pointer;
    white-space:nowrap;
  }
  .add-btn:active{transform:scale(.96);}
  .stepper{
    display:flex;align-items:center;gap:0;
    background:var(--ink-soft2);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .stepper button{
    width:42px;height:48px;
    border:none;background:transparent;
    color:var(--paper);font-size:18px;font-weight:700;
    cursor:pointer;
  }
  .stepper button.minus{color:var(--text-dim);}
  .stepper button.plus{color:var(--ember);}
  .stepper .qty{
    min-width:26px;text-align:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  }

  /* right: total + send */
  .order-zone{
    flex:1;
    display:flex;align-items:center;justify-content:flex-end;gap:14px;
    min-width:0;
  }
  .cart-count{
    font-size:11.5px;color:var(--text-dim);text-align:right;line-height:1.3;
  }
  .cart-count b{color:var(--gold);font-family:'Space Grotesk',sans-serif;font-size:15px;display:block;}
  .send-btn{
    padding:14px 18px;
    border-radius:14px;border:1.5px solid var(--gold);
    background:transparent;color:var(--gold);
    font-weight:700;font-family:'Space Grotesk',sans-serif;
    font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .send-btn:disabled{opacity:.3;cursor:not-allowed;}
  .send-btn:not(:disabled):active{background:var(--gold);color:#1A0E06;}

  /* ---- confirm modal ---- */
  #confirm{
    position:fixed;inset:0;background:rgba(10,8,6,.75);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  #confirm.active{display:flex;}
  .confirm-card{
    background:var(--ink-soft);border:1px solid var(--line);
    border-radius:18px;padding:28px 24px;max-width:320px;text-align:center;
  }
  .confirm-card .check{font-size:34px;margin-bottom:8px;}
  .confirm-card h3{margin:0 0 6px;font-size:18px;}
  .confirm-card p{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
  .confirm-card button{
    background:var(--ember);border:none;color:#1A0E06;
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    padding:11px 22px;border-radius:12px;cursor:pointer;
  }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="table-tag">Table <b id="tableNo">12</b></div>
    <div class="brand">HOLO<span>TABLE</span></div>
  </div>

  <div id="strip"></div>

  <div id="stage">
    <div class="dish-meta">
      <h2 id="dishName">—</h2>
      <p id="dishDesc"></p>
    </div>
    <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1"
      ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed">
    </model-viewer>
    <div class="price-pill" id="dishPrice"></div>
    <button id="ar-launch">View on your table (AR)</button>
  </div>

  <div id="bottombar">
    <div class="add-zone" id="addZone"></div>
    <div class="order-zone">
      <div class="cart-count"><b id="cartTotal">$0</b><span id="cartItems">0 items</span></div>
      <button class="send-btn" id="sendBtn" disabled>Send to kitchen</button>
    </div>
  </div>
</div>

<div id="confirm">
  <div class="confirm-card">
    <div class="check">✓</div>
    <h3>Order sent</h3>
    <p id="orderSummary">Your dishes are on their way to the kitchen.</p>
    <button onclick="closeConfirm()">Back to menu</button>
  </div>
</div>

<script>
const demoModel = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
const demoIOS = "https://modelviewer.dev/shared-assets/models/Astronaut.usdz";
const dishes = [
  {id:1,name:"Neon Burger",price:15,desc:"Smoked beef patty, aged cheddar, pickled shallot.",img:"https://picsum.photos/seed/burger/200/260",model:demoModel,ios:demoIOS},
  {id:2,name:"Cyber Pizza",price:18,desc:"Wood-fired, San Marzano tomato, fresh basil.",img:"https://picsum.photos/seed/pizza/200/260",model:demoModel,ios:demoIOS},
  {id:3,name:"Quantum Pasta",price:14,desc:"Alfredo, roasted garlic, cracked pepper.",img:"https://picsum.photos/seed/pasta/200/260",model:demoModel,ios:demoIOS},
  {id:4,name:"Data Sushi",price:22,desc:"Salmon, avocado, yuzu-wasabi.",img:"https://picsum.photos/seed/sushi/200/260",model:demoModel,ios:demoIOS},
  {id:5,name:"Binary Steak",price:30,desc:"Grilled ribeye, herb butter, medium rare.",img:"https://picsum.photos/seed/steak/200/260",model:demoModel,ios:demoIOS},
  {id:6,name:"Tech Tacos",price:12,desc:"Braised beef, pickled onion, lime crema.",img:"https://picsum.photos/seed/tacos/200/260",model:demoModel,ios:demoIOS},
  {id:7,name:"Laser Salad",price:10,desc:"Charred greens, citrus vinaigrette.",img:"https://picsum.photos/seed/salad/200/260",model:demoModel,ios:demoIOS},
];

let currentIndex = 0;
let cart = {}; // id -> qty

const strip = document.getElementById('strip');
const viewer = document.getElementById('viewer');
const dishName = document.getElementById('dishName');
const dishDesc = document.getElementById('dishDesc');
const dishPrice = document.getElementById('dishPrice');
const addZone = document.getElementById('addZone');
const cartTotalEl = document.getElementById('cartTotal');
const cartItemsEl = document.getElementById('cartItems');
const sendBtn = document.getElementById('sendBtn');

function renderStrip(){
  strip.innerHTML = '';
  dishes.forEach((d,i)=>{
    const qty = cart[d.id]||0;
    const card = document.createElement('div');
    card.className = 'dish-card' + (i===currentIndex?' active':'') + (qty?' in-cart':'');
    card.innerHTML = `
      <img class="thumb" src="${d.img}" alt="${d.name}">
      <div class="badge">${qty}</div>
      <div class="cname">${d.name}</div>`;
    card.onclick = ()=>selectDish(i);
    strip.appendChild(card);
  });
}

function renderAddZone(){
  const d = dishes[currentIndex];
  const qty = cart[d.id]||0;
  if(qty===0){
    addZone.innerHTML = `<button class="add-btn" id="addBtn">+ Add to order</button>`;
    document.getElementById('addBtn').onclick = ()=>{ setQty(d.id, 1); };
  } else {
    addZone.innerHTML = `
      <div class="stepper">
        <button class="minus" id="minusBtn">−</button>
        <span class="qty">${qty}</span>
        <button class="plus" id="plusBtn">+</button>
      </div>`;
    document.getElementById('minusBtn').onclick = ()=> setQty(d.id, qty-1);
    document.getElementById('plusBtn').onclick = ()=> setQty(d.id, qty+1);
  }
}

function setQty(id, qty){
  if(qty<=0){ delete cart[id]; } else { cart[id]=qty; }
  renderAddZone();
  renderStrip();
  updateOrderZone();
}

function selectDish(i){
  currentIndex = i;
  const d = dishes[i];
  dishName.textContent = d.name;
  dishDesc.textContent = d.desc;
  dishPrice.textContent = '$' + d.price;
  viewer.src = d.model;
  viewer.iosSrc = d.ios;
  renderStrip();
  renderAddZone();
}

function updateOrderZone(){
  const ids = Object.keys(cart);
  let total = 0, count = 0;
  ids.forEach(id=>{
    const d = dishes.find(x=>x.id==id);
    total += d.price*cart[id];
    count += cart[id];
  });
  cartTotalEl.textContent = '$'+total;
  cartItemsEl.textContent = count + (count===1?' item':' items');
  sendBtn.disabled = count===0;
}

sendBtn.onclick = ()=>{
  const orderNo = Math.floor(1000+Math.random()*9000);
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  document.getElementById('orderSummary').textContent =
    `Order #${orderNo} · ${count} item${count>1?'s':''} · Table ${document.getElementById('tableNo').textContent}`;
  document.getElementById('confirm').classList.add('active');
};
function closeConfirm(){
  document.getElementById('confirm').classList.remove('active');
  cart = {};
  renderStrip();
  renderAddZone();
  updateOrderZone();
}

// init
selectDish(0);
updateOrderZone();
</script>
</body>
</html>
